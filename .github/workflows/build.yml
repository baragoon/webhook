name: build
on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read
jobs:
  build:
    env:
      # The special value "local" tells Go to use the bundled Go
      # version rather than trying to fetch one according to a
      # `toolchain` value in `go.mod`. This ensures that we're
      # really running the Go version in the CI matrix rather than
      # one that the Go command has upgraded to automatically.
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        # renovate: datasource=golang-version depName=go versioning=semver
        go-version: [1.27.4]
        os: [ubuntu-latest, windows-latest]
        # os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build -v

      - name: Test
        run: go test -v ./...

  build-min:
    env:
      GOTOOLCHAIN: local
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v

      - name: Test
        run: go test -v ./...
