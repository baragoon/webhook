on:
  push:
    branches:
      - master

permissions:
  contents: read
  issues: write

name: Release Please

jobs:
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: simple

  publish-image:
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.release_please.outputs.tag_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Normalize Docker release tag
        id: docker-tag
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          docker_safe_release_tag="${RELEASE_TAG//+/_}"
          echo "docker_safe_release_tag=$docker_safe_release_tag" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.docker-tag.outputs.docker_safe_release_tag }}
            type=semver,pattern=v{{major}},value=${{ needs.release_please.outputs.tag_name }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.release_please.outputs.tag_name }}
            type=raw,value=latest
          flavor: latest=false

      - name: Publish image tags with retries
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
          DOCKER_SAFE_RELEASE_TAG: ${{ steps.docker-tag.outputs.docker_safe_release_tag }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            is_latest=false
            if latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"; then
              if [[ -z "$latest_tag" ]]; then
                echo "::warning::GitHub returned an empty latest release tag; publishing only $DOCKER_SAFE_RELEASE_TAG"
              elif [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
                is_latest=true
              fi
            else
              echo "::warning::Unable to determine the latest release; publishing only $DOCKER_SAFE_RELEASE_TAG"
            fi

            if [[ "$is_latest" == "true" ]]; then
              tags_to_publish="$TAGS"
            else
              tags_to_publish="${IMAGE}:${DOCKER_SAFE_RELEASE_TAG}"
            fi

            tag_args=()
            while IFS= read -r tag; do
              [[ -z "$tag" ]] || tag_args+=(--tag "$tag")
            done <<< "$tags_to_publish"

            if docker buildx imagetools create "${tag_args[@]}" "${IMAGE}@${DIGEST}"; then
              exit 0
            fi

            if (( attempt == 3 )); then
              echo "Failed to publish all image tags after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
