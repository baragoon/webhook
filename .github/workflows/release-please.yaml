on:
  push:
    branches:
      - master

permissions:
  contents: read

name: Release Please

jobs:
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: simple

  publish-image:
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.release_please.outputs.tag_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Determine whether this is the latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ -z "$latest_tag" ]]; then
            echo "GitHub returned an empty latest release tag" >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{raw}},value=${{ needs.release_please.outputs.tag_name }}
            type=semver,pattern=v{{major}},value=${{ needs.release_please.outputs.tag_name }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.release_please.outputs.tag_name }}
            type=raw,value=latest
          flavor: latest=false

      - name: Publish image tags with retries
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
          INITIAL_IS_LATEST: ${{ steps.latest.outputs.is_latest }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if (( attempt > 1 )); then
              latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
              if [[ -z "$latest_tag" ]]; then
                echo "GitHub returned an empty latest release tag" >&2
                exit 1
              fi

              if [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
                is_latest=true
              else
                is_latest=false
              fi
            else
              is_latest="$INITIAL_IS_LATEST"
            fi

            docker_safe_release_tag="${RELEASE_TAG//+/-}"
            if [[ "$is_latest" == "true" ]]; then
              tags_to_publish="$TAGS"
            else
              tags_to_publish="${IMAGE}:${docker_safe_release_tag}"
            fi

            tag_args=()
            while IFS= read -r tag; do
              [[ -z "$tag" ]] || tag_args+=(--tag "$tag")
            done <<< "$tags_to_publish"

            if docker buildx imagetools create "${tag_args[@]}" "${IMAGE}@${DIGEST}"; then
              exit 0
            fi

            if (( attempt == 3 )); then
              echo "Failed to publish all image tags after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
